name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Needs Xcode 26+ for the Icon Composer (.icon) app icon and Swift 6.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build & test
        # `shell: bash` runs the step with `-o pipefail`. Without it, xcbeautify's
        # exit 0 masks a failing xcodebuild and the step goes green with broken
        # tests — the default `bash -e {0}` sets no pipefail.
        shell: bash
        run: |
          xcodebuild test \
            -project ClaudeUsage.xcodeproj \
            -scheme ClaudeUsage \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
        env:
          NSUnbufferedIO: YES
